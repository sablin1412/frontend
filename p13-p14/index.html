<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon-192x192.png" type="image/png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Список дел (PWA)</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <style>
        body { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; padding: 1rem; border: 1px solid #eee; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>📝 Мои задачи</h1>
    <p></p>
    
    <form id="todo-form" class="row">
        <input class="col-9" type="text" id="todo-input" placeholder="Что нужно сделать?" required>
        <button class="col-3 primary" type="submit">Добавить</button>
    </form>
    
    <ul id="todo-list" style="margin-top: 2rem; padding: 0;"></ul>

    <script src="app.js"></script>
</body>
</html>
